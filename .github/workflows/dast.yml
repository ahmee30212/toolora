name: OWASP ZAP Baseline DAST

on:
  workflow_run:
    workflows: ["Toolora CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolora-zap-dast-main
  cancel-in-progress: true

jobs:
  baseline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Passive OWASP ZAP scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tested source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Allow the production edge deployment to settle
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Run OWASP ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://toolora.m-ahmad30212.workers.dev"
          cmd_options: "-a -I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: toolora-zap-baseline
      - name: Fail on actionable ZAP findings
        run: node scripts/check-zap-report.mjs
