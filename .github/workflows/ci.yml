name: Toolora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: toolora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Dependency security report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit.json'); console.log('Dependency audit:', JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + v.severity + '; direct=' + v.isDirect + '; fix=' + JSON.stringify(v.fixAvailable));"
      - name: Enforce zero-vulnerability dependency policy
        run: npm audit --audit-level=low
      - name: Commit dependency lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock npm dependency tree"
            git push
          fi
      - name: Install dependencies from lockfile
        run: npm ci
      - run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
