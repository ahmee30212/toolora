name: Toolora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: toolora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Dependency security report
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const a=require('./npm-audit.json'); console.log('Dependency audit:', JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + v.severity + '; direct=' + v.isDirect + '; fix=' + JSON.stringify(v.fixAvailable));"
      - name: Enforce zero-vulnerability dependency policy
        run: npm audit --audit-level=low
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Validate production smoke script syntax
        run: node --check scripts/smoke-production.mjs
      - run: npm run build
      - name: Test community API security and validation
        run: npm run test:worker
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e

  sync-lockfile:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile"
          git push
