name: OWASP ZAP Baseline DAST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dast.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolora-zap-dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Passive OWASP ZAP scan
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://toolora.m-ahmad30212.workers.dev"
          cmd_options: "-a -I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: toolora-zap-baseline
